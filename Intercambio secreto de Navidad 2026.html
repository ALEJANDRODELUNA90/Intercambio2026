<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navidad en familia 2026</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#235e49,#092d28 75%);color:#fff7e4;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:20px}.panel{width:min(100%,480px);text-align:center;border:1px solid #d5ae6a77;border-radius:28px;padding:28px 22px;background:#ffffff12;box-shadow:0 20px 60px #0005}h1{font-size:2rem;margin:8px 0}p{line-height:1.5}.gift{font-size:78px;margin:14px 0}select,input,button{width:100%;padding:15px;margin:8px 0;border-radius:12px;font:inherit}select,input{background:#fff;color:#15392f;border:0}button{background:#e8bd63;color:#243b2d;font-weight:800;border:0;cursor:pointer}button:hover{background:#ffdc86}.small{opacity:.8;font-size:.85rem}.result{margin-top:18px;padding:20px;border:2px dashed #e8bd63;border-radius:15px;font-size:1.35rem;font-weight:750}label{display:block;text-align:left;margin-top:16px}</style></head><body><main class="panel"><div class="gift">🎁</div><h1>Navidad en familia</h1><p>Intercambio secreto 2026 · Regalo de <b>$700 MXN</b></p><p>Elige tu nombre e introduce tu clave privada para abrir tu sobre.</p><label for="name">Tu nombre</label><select id="name"><option value="">Selecciona tu nombre</option><option>Ale</option><option>Lili</option><option>Mamá</option><option>Papá</option><option>Denisse</option><option>Cassandra</option><option>Pablo</option></select><label for="code">Tu clave individual</label><input id="code" placeholder="Pega tu clave aquí" autocomplete="off"><button id="open">🎄 Abrir mi sobre</button><div id="out" role="status" aria-live="polite"></div><p class="small">No compartas tu clave. Cada participante solo puede descifrar su propia asignación con su clave.</p></main><script>const data={"Ale": {"iv": "vOf93/TEZLlL6/8a", "ct": "C647pYXBizmxWiLZF0MJj0wHr3xKbyE1C9OOlz7gNzHZHBrDrNy6vyt4HifqJw=="}, "Lili": {"iv": "TqRAlTuxwOUYhjB/", "ct": "eJvB9S5kCKWwq/Nj2SVVXhrk6dwatdXGjQKyiG1qCEXu/ljT1CYIS3Hxq6znJ3J2"}, "Mamá": {"iv": "/N4LrYQH6UMySYuM", "ct": "NY3KQwJDGqY7ZN4KQzsAY4xHw7ZbmhXU/wXrPRq3gPj5AWZB7t64yONRgWFXxg=="}, "Papá": {"iv": "yAIjdbLBBhpMTRG+", "ct": "od8IC8Ji10kdEC/utYTiRYmS/+JePvvydRX3egJdhyZLbm8Jbei3P1CScUUm"}, "Denisse": {"iv": "Nt7XeBSTDtiWtzEj", "ct": "rh/AGCbkWcKgGGVsHxJWRDaPFRG4PqF2K2pa7U4FCYJa4l3j49qXV2O+/G2DXQ=="}, "Cassandra": {"iv": "U3UBdRn0gEf23fVZ", "ct": "bvfhVD1rPa1Y6vewBWJvwqFpt+73WFjxnk6b5Jma8QbN5nmBuJncK25HHZM="}, "Pablo": {"iv": "yA2T4CyVHvEWun3K", "ct": "myNBYTUoy2TvC4Lag07cHV5sd2kPFD/ggKqpJyTaQ3LQ6WmFzKR7xeuKsk9Ku5rSsdY="}};const enc=new TextEncoder(),dec=new TextDecoder();function bytes(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0))}document.getElementById('open').onclick=async()=>{const n=document.getElementById('name').value,code=document.getElementById('code').value.trim(),out=document.getElementById('out');out.className='';if(!n||!code){out.textContent='Selecciona tu nombre e introduce tu clave.';return}try{const hash=await crypto.subtle.digest('SHA-256',enc.encode(code));const key=await crypto.subtle.importKey('raw',hash,'AES-GCM',false,['decrypt']);const p=data[n];const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(p.iv),additionalData:enc.encode(n)},key,bytes(p.ct));out.className='result';out.textContent=dec.decode(plain)}catch(e){out.textContent='Clave incorrecta para este participante. Inténtalo de nuevo.'}};</script></body></html>
